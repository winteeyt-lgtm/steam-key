<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Key Generator</title>
    <style>
        /* Базовые стили и переменные для тем */
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a24;
            --border-color: #222c3c;
            --accent-color: #00ffcc;
            --text-color: #ffffff;
            --pill-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            transition: all 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Навигация-таблетка */
        .nav-container {
            background: var(--card-bg);
            padding: 6px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            display: inline-flex;
            position: relative;
            margin-bottom: 30px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-color);
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            z-index: 2;
            border-radius: 50px;
        }

        /* Активная таблетка */
        .nav-pill {
            position: absolute;
            top: 6px;
            left: 6px;
            height: calc(100% - 12px);
            background: var(--pill-bg);
            border-radius: 50px;
            z-index: 1;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Главный контейнер */
        .main-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            min-height: 250px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* Стили Главного Меню */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .code-input {
            flex: 1;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            color: var(--text-color);
            text-align: center;
            letter-spacing: 1px;
        }

        .btn-copy {
            background: var(--border-color);
            border: none;
            color: var(--text-color);
            padding: 0 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-generate {
            background: var(--accent-color);
            color: #000000;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
        }

        .btn-generate:active {
            transform: scale(0.98);
        }

        /* Стили Информации */
        .info-text {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-color);
            opacity: 0.9;
            text-align: center;
        }

        /* Стили Тем */
        .theme-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .theme-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-color);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .theme-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Мини-картинка превью темы */
        .theme-preview {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <div class="nav-container">
        <div class="nav-pill" id="pill"></div>
        <button class="nav-btn" onclick="switchPage('menu', this)">Меню</button>
        <button class="nav-btn" onclick="switchPage('info', this)">Инфо</button>
        <button class="nav-btn" onclick="switchPage('themes', this)">Темы</button>
    </div>

    <div class="main-card">
        
        <div id="page-menu" class="page active">
            <div class="input-group">
                <input type="text" class="code-input" id="keyDisplay" value="XXXXX-XXXXX-XXXXX" readonly>
                <button class="btn-copy" onclick="copyKey()">Копия</button>
            </div>
            <button class="btn-generate" onclick="generateSteamKey()">Сгенерировать</button>
        </div>

        <div id="page-info" class="page">
            <p class="info-text">
                На этом сайте генерируются случайные символы для ключа от игры Steam. С шансом 99.99999% сгенерируется неверный код, но всегда останется тот самый 0.00001% на рабочую игру! Удачи!
            </p>
        </div>

        <div id="page-themes" class="page">
            <div class="theme-list">
                <div class="theme-item" onclick="setTheme('black')">
                    <div class="theme-info">
                        <div class="theme-preview" style="background: linear-gradient(135deg, #0b0e14, #00ffcc);"></div>
                        <span>Тёмная классика</span>
                    </div>
                </div>
                <div class="theme-item" onclick="setTheme('white')">
                    <div class="theme-info">
                        <div class="theme-preview" style="background: linear-gradient(135deg, #f5f5f5, #333333);"></div>
                        <span>Светлая</span>
                    </div>
                </div>
                <div class="theme-item" onclick="setTheme('red')">
                    <div class="theme-info">
                        <div class="theme-preview" style="background: linear-gradient(135deg, #1a0505, #ff3333);"></div>
                        <span>Красный неон</span>
                    </div>
                </div>
                <div class="theme-item" onclick="setTheme('green')">
                    <div class="theme-info">
                        <div class="theme-preview" style="background: linear-gradient(135deg, #051a05, #33ff33);"></div>
                        <span>Хакерский зелёный</span>
                    </div>
                </div>
                <div class="theme-item" onclick="setTheme('blue')">
                    <div class="theme-info">
                        <div class="theme-preview" style="background: linear-gradient(135deg, #050e1a, #3388ff);"></div>
                        <span>Космический синий</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- ЛОГИКА ПЕРЕКЛЮЧЕНИЯ СТРАНИЦ (ТАБЛЕТКА) ---
        function switchPage(pageId, btnElement) {
            // Скрываем все страницы
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            // Показываем нужную
            document.getElementById(`page-${pageId}`).classList.add('active');

            // Двигаем таблетку
            const pill = document.getElementById('pill');
            pill.style.width = btnElement.offsetWidth + 'px';
            pill.style.left = btnElement.offsetLeft + 'px';
        }

        // Устанавливаем таблетку на первую кнопку при старте
        window.onload = function() {
            const firstBtn = document.querySelector('.nav-btn');
            switchPage('menu', firstBtn);
        };

        // --- ЛОГИКА ГЕНЕРАЦИИ КЛЮЧА ---
        function generateSteamKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            function makeBlock() {
                let block = '';
                for (let i = 0; i < 5; i++) {
                    block += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return block;
            }
            const newKey = `${makeBlock()}-${makeBlock()}-${makeBlock()}`;
            document.getElementById('keyDisplay').value = newKey;
        }

        // --- ЛОГИКА КОПИРОВАНИЯ ---
        function copyKey() {
            const copyText = document.getElementById('keyDisplay');
            copyText.select();
            copyText.setSelectionRange(0, 99999); // Для мобилок
            navigator.clipboard.writeText(copyText.value);
            
            const copyBtn = document.querySelector('.btn-copy');
            copyBtn.innerText = '✓';
            setTimeout(() => copyBtn.innerText = 'Копия', 1000);
        }

        // --- СМЕНА ТЕМ ---
        const themes = {
            black: { bg: '#0b0e14', card: '#151a24', border: '#222c3c', accent: '#00ffcc', text: '#ffffff', pill: 'rgba(255,255,255,0.1)' },
            white: { bg: '#f0f2f5', card: '#ffffff', border: '#cccccc', accent: '#333333', text: '#111111', pill: 'rgba(0,0,0,0.1)' },
            red: { bg: '#120202', card: '#1f0505', border: '#3d0a0a', accent: '#ff4444', text: '#ffe5e5', pill: 'rgba(255,68,68,0.2)' },
            green: { bg: '#021202', card: '#051f05', border: '#0a3d0a', accent: '#44ff44', text: '#e5ffe5', pill: 'rgba(68,255,68,0.2)' },
            blue: { bg: '#020b12', card: '#05141f', border: '#0a273d', accent: '#44a6ff', text: '#e5f3ff', pill: 'rgba(68,166,255,0.2)' }
        };

        function setTheme(themeName) {
            const root = document.documentElement;
            const t = themes[themeName];
            
            root.style.setProperty('--bg-color', t.bg);
            root.style.setProperty('--card-bg', t.card);
            root.style.setProperty('--border-color', t.border);
            root.style.setProperty('--accent-color', t.accent);
            root.style.setProperty('--text-color', t.text);
            root.style.setProperty('--pill-bg', t.pill);
        }
    </script>
</body>
</html>
